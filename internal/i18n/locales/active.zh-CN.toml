# 模式
[PatternsShort]
other = "管理已学习的 patterns"

[PatternsLongDesc]
other = "管理已学习的代码模式。\n\n当前支持：\n  add     - 通过 --content 添加用户自定义候选模式，并在入库前完成规范化\n  update  - 通过 --content 修订指定 pattern\n  delete  - 删除指定 pattern\n  compact - 本地整理已有 patterns，减少重复规则\n  show    - 查看数据库中的 pattern 字段、时间和代码位置元数据\n  stats   - 查看模式质量指标。\n\n整理前建议先运行 'skills-seed patterns show' 检查已有内容。"

[PatternsExample]
other = "  # 查看 patterns 数据库字段\n  skills-seed patterns show\n\n  # 查看单条 pattern 详情\n  skills-seed patterns show business-create-order\n\n  # 整理所有分类中的相似 patterns\n  skills-seed patterns compact"

[PatternsCompactShort]
other = "整理相似 patterns"

[PatternsCompactLongDesc]
other = "默认使用本地确定性规则整理已学习 patterns，将高度相似的条目合并为更少、更清晰的 patterns，不调用 Agent。\n\n默认会写回数据库；使用 --dry-run 可只预览整理摘要。可用 --category 限定分类。"

[PatternsCompactExample]
other = "  # 本地整理所有相似 patterns 并写回数据库\n  skills-seed patterns compact\n\n  # 只整理 api 分类\n  skills-seed patterns compact --category api\n\n  # 预览整理结果，不写入数据库\n  skills-seed patterns compact --dry-run"

[PatternsCompactFlagCategory]
other = "只整理指定分类，如 business、api、testing；留空表示所有分类"

[PatternsCompactFlagDryRun]
other = "只预览整理结果，不写入数据库"

[PatternsCompactComplete]
other = "Patterns 整理完成: 输入 {{.TotalInput}}，写入 {{.TotalWritten}}，丢弃 {{.TotalDropped}}，合并分组 {{.MergeCount}}"

[PatternsAddShort]
other = "用自然语言添加用户自定义模式"

[PatternsAddLongDesc]
other = "通过 --content 或 --content-path 使用自然语言描述编码规范或模式，AI 结合项目上下文生成结构化 Pattern。\n\nAI 会根据描述自动推断分类、生成示例和可操作规则。--content-path 可读取文件或目录，适合传入较长的说明、规范草稿或一次性参考材料。"

[PatternsAddExample]
other = "  # 直接传入内容\n  skills-seed patterns add --content \"所有 service 方法必须返回 domain error\"\n\n  # 指定分类\n  skills-seed patterns add --content \"分页查询统一使用 limit/offset\" --category api\n\n  # 从文件或目录读取较长内容；多个来源重复传入 --content-path\n  skills-seed patterns add --content-path docs/plan.md --content-path docs/specs --category api"

